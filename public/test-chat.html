<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Test Chat</title>
<style>
  :root {
    --bg: #ffffff; --text: #1d2330; --muted: #6b7385; --border: #cfd4de;
    --field: #f3f4f7; --bot: #eceff4; --user: #2563eb; --user-text: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --text: #e8ebf2; --muted: #8b93a7; --border: #2f3542;
      --field: #1b1f27; --bot: #1d2126; --user: #3b6fe0; --user-text: #ffffff;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
    padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  .wrap { width: 100%; max-width: 760px; }
  #log {
    margin: 0 0 14px; height: 60vh; min-height: 320px; overflow-y: auto;
    border: 1px solid var(--border); border-radius: 12px; padding: 16px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .msg { max-width: 80%; padding: 10px 16px; border-radius: 16px; line-height: 1.45; font-size: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .bot { background: var(--bot); align-self: flex-start; }
  .user { background: var(--user); color: var(--user-text); align-self: flex-end; }
  .typing { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 10px; }
  #input {
    flex: 1; padding: 12px 14px; font-size: 16px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--field); color: var(--text); outline: none;
  }
  #input:focus { border-color: var(--user); }
  button {
    padding: 0 22px; border: 0; border-radius: 8px; background: var(--user);
    color: var(--user-text); font-size: 16px; cursor: pointer;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="wrap">
  <div id="log"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Ketik pesan…" autocomplete="off" required>
    <button id="send" type="submit">Kirim</button>
  </form>
</div>

<script>
  // Alamat backend. Dipakai dari domain yang sama; kalau file ini dibuka dari tempat lain, pakai alamat Vercel.
  const API_URL = location.protocol.startsWith("http") ? location.origin + "/api/chat" : "https://iti-halper.vercel.app/api/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const history = [];

  function tambah(teks, kelas) {
    const el = document.createElement("div");
    el.className = "msg " + kelas;
    el.textContent = teks;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const teks = input.value.trim();
    if (!teks) return;

    tambah(teks, "user");
    history.push({ role: "user", content: teks });
    input.value = "";
    send.disabled = true;
    const loading = tambah("Sedang mengetik…", "bot typing");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: history })
      });
      const data = await res.json();
      loading.remove();
      if (!res.ok || !data.reply) throw new Error(data.error || "Server membalas dengan error " + res.status);
      tambah(data.reply, "bot");
      history.push({ role: "assistant", content: data.reply });
    } catch (err) {
      loading.remove();
      tambah("Gagal terhubung ke server: " + err.message, "bot");
      history.pop();
    } finally {
      send.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
